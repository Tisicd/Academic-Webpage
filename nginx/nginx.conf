worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Configuración básica
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Configura el balanceo de carga para las instancias web1 y web2
    upstream app_servers {
        server web1:8000;  # Primera instancia de Gunicorn
        server web2:8000;  # Segunda instancia de Gunicorn
    }

    server {
        listen 80;
        server_name localhost;  # Cambia esto si tienes un dominio en producción

        # Configuración para manejar las solicitudes al root (balanceo de carga)
        location / {
            proxy_pass http://app_servers;  # Redirige las solicitudes a las instancias balanceadas
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Opcional: Aumentar el timeout para aplicaciones más lentas
            proxy_read_timeout 90;
            proxy_connect_timeout 90;
            proxy_send_timeout 90;
        }

        # Manejo de archivos estáticos
        location /static/ {
            alias /app/static/;  # Sirve los archivos estáticos desde el contenedor de Flask
            expires 180d;  # Permite cachear archivos estáticos durante 180 días
            add_header Cache-Control "public";
        }

        # Limita el tamaño de las solicitudes (40MB en este caso)
        client_max_body_size 40M;

    }
}
