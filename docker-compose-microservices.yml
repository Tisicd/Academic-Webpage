# Docker Compose para Arquitectura de Microservicios
# Preparación para arquitectura distribuida del Sistema UCE

version: '3.8'

services:
  # ==================== API GATEWAY ====================
  nginx:
    image: nginx:alpine
    container_name: uce_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-microservices.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - auth_service
      - recursos_service
      - analytics_service
    networks:
      - uce_network
    restart: unless-stopped

  # ==================== SERVICIO DE AUTENTICACIÓN ====================
  auth_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uce_auth_service
    environment:
      - SERVICE_NAME=auth
      - SERVICE_PORT=5001
      - DATABASE_URL=postgresql://uce_user:uce_pass@postgres_auth:5432/uce_auth_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
    ports:
      - "5001:5001"
    volumes:
      - ./app_recursos:/app/app_recursos
    depends_on:
      - postgres_auth
      - redis
    networks:
      - uce_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== SERVICIO DE RECURSOS ====================
  recursos_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uce_recursos_service
    environment:
      - SERVICE_NAME=recursos
      - SERVICE_PORT=5002
      - DATABASE_URL=postgresql://uce_user:uce_pass@postgres_recursos:5432/uce_recursos_db
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    ports:
      - "5002:5002"
    volumes:
      - ./app_recursos:/app/app_recursos
      - recursos_uploads:/app/uploads
    depends_on:
      - postgres_recursos
      - redis
      - minio
    networks:
      - uce_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== SERVICIO DE ANALYTICS ====================
  analytics_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uce_analytics_service
    environment:
      - SERVICE_NAME=analytics
      - SERVICE_PORT=5003
      - DATABASE_URL=postgresql://uce_user:uce_pass@postgres_analytics:5432/uce_analytics_db
      - REDIS_URL=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
    ports:
      - "5003:5003"
    volumes:
      - ./app_recursos:/app/app_recursos
    depends_on:
      - postgres_analytics
      - redis
    networks:
      - uce_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== BASES DE DATOS ====================
  
  # Base de Datos - Autenticación
  postgres_auth:
    image: postgres:13-alpine
    container_name: uce_postgres_auth
    environment:
      - POSTGRES_USER=uce_user
      - POSTGRES_PASSWORD=uce_pass
      - POSTGRES_DB=uce_auth_db
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - uce_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uce_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Base de Datos - Recursos
  postgres_recursos:
    image: postgres:13-alpine
    container_name: uce_postgres_recursos
    environment:
      - POSTGRES_USER=uce_user
      - POSTGRES_PASSWORD=uce_pass
      - POSTGRES_DB=uce_recursos_db
    volumes:
      - postgres_recursos_data:/var/lib/postgresql/data
    networks:
      - uce_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uce_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Base de Datos - Analytics
  postgres_analytics:
    image: postgres:13-alpine
    container_name: uce_postgres_analytics
    environment:
      - POSTGRES_USER=uce_user
      - POSTGRES_PASSWORD=uce_pass
      - POSTGRES_DB=uce_analytics_db
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
    networks:
      - uce_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uce_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== CACHÉ Y SESIONES ====================
  redis:
    image: redis:6-alpine
    container_name: uce_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - uce_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== ALMACENAMIENTO DE ARCHIVOS ====================
  minio:
    image: minio/minio:latest
    container_name: uce_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - uce_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== MONITOREO ====================
  
  # Prometheus - Métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: uce_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - uce_network
    restart: unless-stopped

  # Grafana - Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: uce_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - uce_network
    restart: unless-stopped

  # ==================== LOGGING ====================
  
  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: uce_elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - uce_network
    restart: unless-stopped

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.0
    container_name: uce_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - uce_network
    restart: unless-stopped

# ==================== VOLÚMENES ====================
volumes:
  postgres_auth_data:
    driver: local
  postgres_recursos_data:
    driver: local
  postgres_analytics_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  recursos_uploads:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

# ==================== REDES ====================
networks:
  uce_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

