<!DOCTYPE html>
<html lang="es">

<head>
    <title>Olvidé mi Contraseña</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url("{{ url_for('static', filename='img/uce-1.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .left {
            margin-right: 50px;
        }

        .left h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .left p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .input-container {
            margin-bottom: 20px;
        }

        .input-container input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .left button {
            width: 100%;
            padding: 10px;
            background-color: #06BBCC;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .left a {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #06BBCC;
            text-decoration: none;
            font-size: 14px;
        }

        .right {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .right .icon {
            font-size: 50px;
            color: #06BBCC;
            margin-bottom: 20px;
        }

        .right .question-mark {
            font-size: 50px;
            color: #06BBCC;
            margin-bottom: 20px;
        }

        .right .paper-plane {
            font-size: 50px;
            color: #06BBCC;
        }
    </style>
</head>

<body>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.querySelector('form');

            form.addEventListener('submit', function (event) {
                event.preventDefault();
                
                const formData = new FormData(form);
                
                fetch(form.action, {
                    method: 'POST',
                    body: formData,
                })
                .then(() => {
                    alert('Se ha enviado un correo. Revisa tu bandeja de entrada.');
                    window.location.href = "{{ url_for('app_bp.login') }}";
                })
                .catch(() => {
                    alert('Error de conexión. Inténtalo más tarde.');
                });
            });
        });
    </script>
    
    <div class="container">
        <div class="left">
            <h1>Olvidaste tu contraseña?</h1>
            <p>Ingresa tu dirección de correo, sigue los pasos en el correo que se enviará a la cuenta registrada.</p>

            <form action="{{ url_for('app_bp.forgot_password') }}" method="POST">
                {{ form.hidden_tag() }} <!-- Token CSRF para seguridad -->

                <div class="input-container">
                   <label for="email">Correo Electrónico</label>
    <input type="email" name="email" id="email" required placeholder="Ingresa tu correo">
    {% if form.email.errors %}
        <div class="error-message">{{ form.email.errors[0] }}</div>
    {% endif %}
</div>

                {{ form.submit(class="left button") }} <!-- Botón de envío manejado por Flask-WTF -->
            </form>

            <a href="{{ url_for('app_bp.login') }}">Regresar</a>
        </div>
        <div class="right">
            <div class="question-mark">?</div>
            <div class="icon"><i class="fas fa-envelope"></i></div>
            <div class="paper-plane"><i class="fas fa-paper-plane"></i></div>
        </div>
    </div>
</body>

</html>
