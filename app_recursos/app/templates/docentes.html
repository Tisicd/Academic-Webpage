{% extends "layout.html" %}

{% block title %}
Docentes - UCE Ciencias Económicas
{% endblock %}

{% block content %}
<!-- Header Start -->
<div class="container-fluid bg-primary py-5 mb-5 page-header">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10 text-center">
                <h1 class="display-3 text-white animated slideInDown">Docentes</h1>
            </div>
        </div>
    </div>
</div>
<!-- Header End -->

<!-- Section Title for Docentes -->
<div class="container text-center py-3">
    <h2 class="display-5 text-primary mb-2">Nuestros Docentes</h2>
</div>

<!-- Section for Cards of Docentes -->
<div class="container-xxl py-5">
    <div class="container">
        <div class="row g-4">
            {% for docente in docentes %}
            <div class="col-lg-4 col-md-6">
                <div class="card bg-light border-0 shadow-sm">
                    <div class="card-body text-center">
                        <img class="rounded-circle mb-3" style="width: 150px; height: 150px; object-fit: cover;"
                             src="{% if docente.is_docente and docente.foto_perfil %}{{ docente.foto_perfil }}{% else %}{{ url_for('static', filename='img/default_profile.png') }}{% endif %}"
                             alt="{{ docente.nombre }} {{ docente.apellido }}">
                        <h5 class="card-title">{{ docente.nombre }} {{ docente.apellido }}</h5>
                        <p class="card-text text-secondary">{{ docente.carrera.nombre }}</p>
                        <button class="btn btn-primary" onclick="mostrarPerfil({{ docente.id }})">
                            Ver Perfil <i class="fas fa-arrow-right ms-2"></i>
                        </button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<!-- Modal for Docente Profile -->
<div id="modalPerfilDocente" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close" onclick="cerrarModal()">&times;</span>
        <div id="perfilDocenteContainer"></div>
    </div>
</div>

<style>
    /* Modal Styles */
    .modal {
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .modal-content {
        background-color: #fefefe;
        padding: 20px;
        border-radius: 10px;
        width: 80%;
        max-width: 600px;
        box-shadow: 0px 0px 10px 2px rgba(0, 0, 0, 0.2);
    }

    .close {
        color: #aaaaaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }

    .close:hover,
    .close:focus {
        color: #000;
        text-decoration: none;
        cursor: pointer;
    }
</style>

<script>
    // JavaScript para abrir el modal con la información del docente
    function mostrarPerfil(docenteId) {
        fetch(`/api/docente/${docenteId}`)
            .then(response => response.json())
            .then(data => {
                // Crear contenido dinámico para el modal con la información del docente
                const perfilContainer = document.getElementById('perfilDocenteContainer');
                perfilContainer.innerHTML = `
                    <div style="font-size: 18px;">
                        <h3>${data.nombre} ${data.apellido}</h3>
                        <p><strong>Tipo de Usuario:</strong> ${data.tipo_usuario}</p>
                        <p><strong>Carrera:</strong> ${data.carrera}</p>
                        <p><strong>Redes Educativas:</strong> ${data.redes_educativas ? data.redes_educativas : 'No disponible'}</p>
                        <p><strong>Artículos Publicados:</strong> ${data.articulos_publicados ? data.articulos_publicados : 'No disponible'}</p>
                        <p><strong>Materias que Imparte:</strong> ${data.materias.length ? data.materias.join(', ') : 'No disponible'}</p>
                    </div>
                `;
                document.getElementById('modalPerfilDocente').style.display = 'flex';
            })
            .catch(error => console.error('Error al obtener la información del docente:', error));
    }

    // JavaScript para cerrar el modal
    function cerrarModal() {
        document.getElementById('modalPerfilDocente').style.display = 'none';
    }
</script>
{% endblock %}
